<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Original illustration: code brackets and circuit lines in teal on a dark background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2e2b"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- circuit traces -->
  <g stroke="#0f766e" stroke-width="3" fill="none" opacity="0.7">
    <path d="M40 60 H180 V140 H300"/>
    <path d="M560 340 H420 V260 H300"/>
    <path d="M40 340 H120 V260"/>
    <path d="M560 60 H480 V140"/>
  </g>
  <g fill="#14a098">
    <circle cx="40" cy="60" r="7"/>
    <circle cx="560" cy="340" r="7"/>
    <circle cx="40" cy="340" r="7"/>
    <circle cx="560" cy="60" r="7"/>
    <circle cx="300" cy="140" r="5"/>
    <circle cx="300" cy="260" r="5"/>
  </g>
  <!-- code brackets -->
  <g fill="none" stroke="#e94560" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 150 L200 200 L250 250"/>
    <path d="M350 150 L400 200 L350 250"/>
  </g>
  <g stroke="#53d8fb" stroke-width="9" stroke-linecap="round">
    <line x1="315" y1="140" x2="285" y2="260"/>
  </g>
  <text x="300" y="330" text-anchor="middle" font-family="monospace" font-size="26" fill="#eeeeee">hello, i'm kenneth</text>
  <text x="300" y="362" text-anchor="middle" font-family="monospace" font-size="15" fill="#53d8fb">we build. we experiment. we ship.</text>
</svg>
